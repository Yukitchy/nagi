<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ナギ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=M+PLUS+1p:wght@900&display=swap" rel="stylesheet">
<style>
/* ========= 案① ライト・ソフト =========
   線画アイコン（案③）に戻す時は、body冒頭の「線画アイコン版（切り替え用・案③のアイコン）」の
   HTMLコメントを外し、JS側の ic() も同じ手順で差し替える。 */
:root{
  --bg:linear-gradient(180deg,#fdfaf3,#eaf1f8 62%,#e4eef6);
  --card:#ffffff; --ink:#22364a; --sub:#7e8fa0;
  --acc:#4a90b8; --accd:#2b5d7d; --acc-soft:#d6e8f3; --acc-tint:#e3eef5;
  --line:#e7eef4; --hair:#eef3f7; --ok:#4caf7d;
  --shadow:0 4px 14px rgba(90,120,150,.13);
  --bar:linear-gradient(180deg,#5aa0c6,#2b5d7d);
  --radius:16px; --gap:9px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Zen Kaku Gothic New',sans-serif; background:#dfe7ee; color:var(--ink);
  display:flex; justify-content:center; align-items:flex-start;
  line-height:1.7; overflow-wrap:break-word; word-break:auto-phrase;
}
#phone{
  width:100%; max-width:430px; min-height:100vh; background:var(--bg);
  display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 40px rgba(43,61,77,.15);
}
main{flex:1; padding:20px 18px 96px; overflow-y:auto}
.screen{display:none}
.screen.active{display:block; animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.emo{line-height:1; font-style:normal}
/* 線画アイコン用（切り替え用に残す） */
.li{display:block; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round}

/* header */
header{padding:18px 20px 4px; display:flex; align-items:baseline; gap:8px}
header h1{font-size:22px; font-weight:900; letter-spacing:.06em; color:var(--accd)}
header .sub{font-size:11px; color:var(--sub); font-weight:500}

/* home */
.today-msg{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 18px; margin-bottom:var(--gap); font-size:14px;
}
.today-msg b{color:var(--accd)}
.wave-btn{
  width:100%; border:none; cursor:pointer; border-radius:20px;
  background:linear-gradient(160deg,#5aa0c6,#2b5d7d); color:#fff;
  padding:32px 20px 30px; text-align:center; font-family:inherit;
  position:relative; overflow:hidden;
  box-shadow:0 8px 18px rgba(43,93,125,.28); margin-bottom:var(--gap);
  transition:transform .12s ease;
}
.wave-btn:active{transform:scale(.97)}
.wave-btn .big{font-size:24px; font-weight:900; letter-spacing:.04em; position:relative; z-index:2;
  display:flex; align-items:center; justify-content:center; gap:10px}
.wave-btn .small{font-size:12px; opacity:.9; margin-top:6px; position:relative; z-index:2}
.wave-btn svg{position:absolute; bottom:-6px; left:0; width:200%; height:60px; opacity:.3; z-index:1;
  animation:drift 7s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.quickrow{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap)}
.quick{
  background:var(--card); border:none; cursor:pointer; border-radius:var(--radius);
  padding:16px 12px; font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:var(--shadow);
}
.quick .emo{font-size:24px}

/* wave flow */
#waveflow{
  position:fixed; inset:0; background:linear-gradient(180deg,#1d3d52,#2b5d7d 60%,#3d7ea6);
  color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px; z-index:50; overflow:hidden;
}
#waveflow.active{display:flex}
#waveflow>*{position:relative; z-index:2}
/* 海面: 3層パララックス波（塗り） */
#wf-waves{position:absolute; left:0; right:0; bottom:0; height:34vh; z-index:1; pointer-events:none;
  transition:transform 4s ease-in-out}
#wf-waves svg{position:absolute; bottom:0; left:0; width:200%; height:100%; preserveAspectRatio:none}
#wf-waves .w1{opacity:.10; animation:wdrift 26s linear infinite}
#wf-waves .w2{opacity:.14; animation:wdrift 17s linear infinite reverse; bottom:-4vh}
#wf-waves .w3{opacity:.22; animation:wdrift 11s linear infinite; bottom:-9vh}
@keyframes wdrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#wf-bgm{
  position:absolute; top:20px; right:18px; z-index:3;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4); color:#fff;
  border-radius:99px; padding:9px 16px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
#wf-bgm.off{opacity:.55}
#wf-back{
  position:absolute; top:20px; left:18px; z-index:3;
  background:none; border:none; color:rgba(255,255,255,.75);
  font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:9px 10px;
}
/* 外周リング固定・内側の円だけ満ち欠け＝文字と重ならない */
#breath-circle{
  width:190px; height:190px; border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:26px;
}
#breath-disc{
  width:100%; height:100%; border-radius:50%;
  background:rgba(255,255,255,.16);
  display:flex; align-items:center; justify-content:center;
  font-family:'M PLUS 1p',sans-serif; font-size:60px; font-weight:900; letter-spacing:-.02em;
  color:#fff; font-variant-numeric:tabular-nums; transform:scale(.5);
}
#breath-disc.waiting{font-size:26px; cursor:pointer}
/* 呼吸の言葉は円の下（円の中は数字だけ） */
#wf-word{font-family:'M PLUS 1p',sans-serif; font-size:24px; font-weight:900; margin-top:2px; min-height:34px}
#waveflow .timer{font-size:14px; opacity:.75; margin-top:14px}
#waveflow .skip{margin-top:30px; background:none; border:1px solid rgba(255,255,255,.4); color:#fff;
  border-radius:99px; padding:10px 26px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:7px}
#wavedone{display:none; position:fixed; inset:0; background:var(--bg); z-index:51;
  flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px}
#wavedone.active{display:flex}
#wavedone .nagi{font-size:56px; margin-bottom:10px}
#wavedone h2{font-size:22px; font-weight:900; color:var(--accd); margin-bottom:12px}
#wavedone p{font-size:14px; color:var(--sub); margin-bottom:26px}
#wavedone p b{color:var(--ink)}
.btn-primary{
  background:var(--acc); color:#fff; border:none; border-radius:99px;
  padding:14px 40px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:0 5px 13px rgba(74,144,184,.3);
}

/* mirror */
.section-title{font-size:16px; font-weight:900; margin:4px 0 4px; color:var(--accd);
  display:flex; align-items:center; gap:7px}
.section-lead{font-size:12px; color:var(--sub); margin-bottom:14px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.chip{
  background:var(--card); border:1.5px solid transparent; border-radius:99px;
  padding:9px 14px; font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
  cursor:pointer; box-shadow:var(--shadow); transition:all .12s;
}
.chip.on{border-color:var(--acc); background:var(--acc-tint); color:var(--accd)}
#mirror-result{
  display:none; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px; margin-top:8px;
}
#mirror-result.show{display:block; animation:fadein .3s ease}
#mirror-result .who{font-size:11px; color:var(--sub); margin-bottom:8px}
#mirror-result .msg{font-size:15px; font-weight:700; line-height:1.9}
#mirror-result .msg em{font-style:normal; color:var(--acc); border-bottom:1.5px solid var(--acc-soft)}

/* facts */
.fact{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px 16px; margin-bottom:var(--gap);
  display:flex; align-items:center; gap:13px;
}
.fact .icon{font-size:22px; flex:none; line-height:1}
.fact .t{font-size:14px; font-weight:700; flex:1}
.fact .stamp{
  font-size:10px; font-weight:900; color:var(--ok); border:1.5px solid var(--ok);
  border-radius:6px; padding:2px 7px; white-space:nowrap; transform:rotate(-6deg);
}
.fact.auto{background:var(--acc-tint)}
.txt-in{border:1px solid #dfe6ec; border-radius:12px; padding:11px 12px;
  font-family:inherit; font-size:13px; color:var(--ink); background:#fff}

/* log */
#chart{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:12px}
.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); margin-bottom:var(--gap)}
.stat{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; text-align:center}
.stat .num{font-family:'M PLUS 1p',sans-serif; font-size:28px; font-weight:900; color:var(--accd); line-height:1.3}
.stat .lab{font-size:11px; color:var(--sub)}
.survive{
  background:linear-gradient(160deg,#5aa0c6,#2b5d7d); color:#fff; border-radius:var(--radius);
  padding:18px; font-size:14px; font-weight:700; line-height:1.9;
}
.survive .pct{font-family:'M PLUS 1p',sans-serif; font-size:32px; font-weight:900}

/* nav */
nav{
  position:absolute; bottom:0; left:0; right:0; background:var(--card);
  display:flex; border-top:1px solid var(--line); padding:8px 6px calc(10px + env(safe-area-inset-bottom));
}
nav button{
  flex:1; background:none; border:none; font-family:inherit; cursor:pointer;
  font-size:10px; font-weight:700; color:var(--sub); padding:6px 0;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .emo{font-size:20px; filter:grayscale(1); opacity:.55}
nav button .li{opacity:.45}
nav button.on{color:var(--accd)}
nav button.on .emo{filter:none; opacity:1}
nav button.on .li{opacity:1}

/* help footer */
.helpline{
  margin-top:24px; padding:14px 16px; border-radius:var(--radius);
  background:#fdf4f2; font-size:11px; color:#a0625c; line-height:1.9;
}
.helpline b{display:block; font-size:12px}
.disclaimer{font-size:10px; color:#9aa2a9; margin-top:10px; text-align:center; line-height:1.7}
</style>
</head>
<body>

<div id="phone">
  <header><h1>ナギ</h1></header>
  <main>

    <!-- HOME -->
    <section class="screen active" id="scr-home">
      <div class="today-msg" id="today-msg"></div>
      <button class="wave-btn" onclick="startWave()">
        <div class="big"><span class="emo">🌊</span>波が来た</div>
        <div class="small">深呼吸する</div>
        <svg viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0,30 C150,60 350,0 600,30 C850,60 1050,0 1200,30 L1200,60 L0,60 Z" fill="#fff"/></svg>
      </button>
      <div class="quickrow">
        <button class="quick" onclick="go('mirror')"><span class="emo">🪞</span>今日のできてるよ</button>
        <button class="quick" onclick="go('facts')"><span class="emo">📌</span>事実の鏡</button>
      </div>
      <div class="helpline">
        <b>つらいときの相談先</b>
        いのちの電話 0570-064-556<br>
        よりそいホットライン 0120-279-338<br>
        24時間・無料
      </div>
      <div class="disclaimer">ナギは医療機器ではありません。<br>記録は端末の中だけに保存されます。</div>
    </section>

    <!-- MIRROR -->
    <section class="screen" id="scr-mirror">
      <div class="section-title"><span class="emo">🪞</span>今日のできてるよ</div>
      <div class="section-lead">今日あったことをタップする。</div>
      <div class="chips" id="chips"></div>
      <button class="btn-primary" style="width:100%" onclick="mirror()">ミラーに映す</button>
      <div id="mirror-result">
        <div class="who">— これが息子の1日だったら —</div>
        <div class="msg" id="mirror-msg"></div>
      </div>
      <div id="mirror-history"></div>
    </section>

    <!-- FACTS -->
    <section class="screen" id="scr-facts">
      <div class="section-title"><span class="emo">📌</span>事実の鏡</div>
      <div class="section-lead">事実だけを置く場所。<br>記録から自動で増える。</div>
      <div id="facts-auto"></div>
      <div id="facts"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <input id="fact-in" class="txt-in" placeholder="事実を追加（例: 息子と公園に行った）" style="flex:1;min-width:0">
        <button class="btn-primary" style="padding:11px 18px;font-size:13px" onclick="addFact()">追加</button>
      </div>
    </section>

    <!-- LOG -->
    <section class="screen" id="scr-log">
      <div class="section-title"><span class="emo">📈</span>波ログ</div>
      <div class="section-lead">記録した波の一覧。</div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="st-count">0</div><div class="lab">乗り越えた波</div></div>
        <div class="stat"><div class="num" id="st-streak">0</div><div class="lab">連続チェックイン日数</div></div>
      </div>
      <div id="chart"></div>
      <div class="survive">
        来た波が引いた確率<br>
        <span class="pct" id="st-pct">—</span><br>
        <span id="st-note" style="font-size:12px;font-weight:500;color:var(--sub)"></span>
      </div>
    </section>

    <!-- FEEDBACK -->
    <section class="screen" id="scr-fb">
      <div class="section-title"><span class="emo">✍️</span>感想（ヨシ君用）</div>
      <div class="section-lead">思ったことを書く。<br>書けた分だけで提出できる。</div>
      <div id="fb-list"></div>
      <input id="fb-name" class="txt-in" placeholder="なまえ（例: ヨシ）" style="width:100%;font-size:14px;padding:12px;margin:4px 0 12px">
      <button class="btn-primary" style="width:100%" onclick="fbOpen()">感想を提出する</button>
      <div id="fb-result" style="display:none;margin-top:14px;background:var(--card);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px">
        <div style="font-size:12px;color:var(--sub);margin-bottom:8px">提出テキストができました。<br>コピーしてユウキに送るだけです。</div>
        <textarea id="fb-out" readonly style="width:100%;min-height:170px;border:1px solid #dfe6ec;border-radius:12px;padding:10px;font-family:inherit;font-size:11px;line-height:1.7;background:#fafbfc;resize:none;color:var(--ink)"></textarea>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn-primary" style="flex:1;padding:12px 8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px" id="fb-copy" onclick="fbCopy(this)"><span class="emo">📋</span><span>コピー</span></button>
          <button class="btn-primary" style="flex:1;padding:12px 8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px" onclick="fbShare()"><span class="emo">📤</span><span>共有</span></button>
        </div>
      </div>
    </section>

  </main>
  <nav>
    <button class="on" data-s="home" onclick="go('home')"><span class="emo">🌊</span>ホーム</button>
    <button data-s="mirror" onclick="go('mirror')"><span class="emo">🪞</span>ミラー</button>
    <button data-s="facts" onclick="go('facts')"><span class="emo">📌</span>事実</button>
    <button data-s="log" onclick="go('log')"><span class="emo">📈</span>波ログ</button>
    <button data-s="fb" onclick="go('fb')"><span class="emo">✍️</span>感想</button>
  </nav>
</div>

<!-- WAVE FLOW -->
<div id="waveflow">
  <button id="wf-back" onclick="exitWave()">← 戻る</button>
  <button id="wf-bgm" onclick="toggleBgm()"><span class="emo" id="wf-bgm-ic">🔊</span><span id="wf-bgm-t">波の音 ON</span></button>
  <div id="wf-waves">
    <svg class="w1" viewBox="0 0 2400 240" preserveAspectRatio="none"><path d="M0,120 C200,60 400,180 600,120 C800,60 1000,180 1200,120 C1400,60 1600,180 1800,120 C2000,60 2200,180 2400,120 L2400,240 L0,240 Z" fill="#fff"/></svg>
    <svg class="w2" viewBox="0 0 2400 240" preserveAspectRatio="none"><path d="M0,130 C150,80 450,170 600,130 C750,90 1050,170 1200,130 C1350,90 1650,170 1800,130 C1950,90 2250,170 2400,130 L2400,240 L0,240 Z" fill="#fff"/></svg>
    <svg class="w3" viewBox="0 0 2400 240" preserveAspectRatio="none"><path d="M0,140 C300,100 300,180 600,140 C900,100 900,180 1200,140 C1500,100 1500,180 1800,140 C2100,100 2100,180 2400,140 L2400,240 L0,240 Z" fill="#fff"/></svg>
  </div>
  <div id="breath-circle"><div id="breath-disc" onclick="beginBreath()"><span id="wf-count"></span></div></div>
  <div id="wf-word"></div>
  <div class="timer" id="wf-timer"></div>
  <button class="skip" onclick="endWave(true)"><span class="emo">🏖️</span>もう大丈夫</button>
</div>
<div id="wavedone">
  <div class="nagi">🏖️</div>
  <h2>凪</h2>
  <p id="done-msg"></p>
  <button class="btn-primary" onclick="closeDone()">ホームへ戻る</button>
</div>

<script>
// ---- storage ----
const store = {
  get k(){ return 'nagi-v1'; },
  load(){ try{ return JSON.parse(localStorage.getItem(this.k))||{waves:[],days:{}} }catch(e){ return {waves:[],days:{}} } },
  save(d){ localStorage.setItem(this.k, JSON.stringify(d)); }
};
let data = store.load();
const todayKey = () => new Date().toISOString().slice(0,10);
const EMO = {wave:'🌊',mirror:'🪞',pin:'📌',chart:'📈',pen:'✍️',beach:'🏖️',sound:'🔊',mute:'🔇',
  book:'📚',work:'💼',star:'⭐',house:'🏠',money:'📊',fire:'🔥',check:'✅',copy:'📋',share:'📤',note:'📝'};
const ic = (n,sz) => `<span class="emo" style="font-size:${sz}px">${EMO[n]||''}</span>`;
/* 線画アイコン版（切り替え用・案③のアイコン）: 上の ic を消してこの行を有効にすると線画に戻る
const ic = (n,sz) => `<svg class="li" width="${sz}" height="${sz}"><use href="#i-${n}"/></svg>`;
*/

// ---- nav ----
function go(s){
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
  document.getElementById('scr-'+s).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===s));
  if(s==='log') renderLog();
}

// ---- home message (self-distancing / no empty praise) ----
function renderToday(){
  const n = data.waves.length;
  const el = document.getElementById('today-msg');
  const streak = calcStreak();
  if(n===0 && streak===0){
    el.innerHTML = '波が来たら下のボタンを押す。<br>それ以外の時間は使わなくて大丈夫。';
  } else {
    el.innerHTML = `乗り越えた波 <b>${n}回</b>。`;
  }
}

// ---- wave flow: 4-7-8呼吸 ×3 + urge surfing copy ----
let wfTimer=null, wfStart=0;
const PHASES = [
  {label:'吸って', cls:'in',  sec:4},
  {label:'とめて', cls:'hold',sec:7},
  {label:'吐いて', cls:'out', sec:8},
];
let wfWaiting=false;
// 開いた直後は始めない: スタート待機で自分のペースで始められる
function startWave(){
  document.getElementById('waveflow').classList.add('active');
  wfStart = Date.now();
  renderBgmBtn();
  wfWaiting=true;
  const disc=document.getElementById('breath-disc');
  disc.classList.add('waiting');
  disc.style.transition='transform .3s ease';
  disc.style.transform='scale(.72)';
  document.getElementById('wf-count').textContent='スタート';
  document.getElementById('wf-word').textContent='';
  document.getElementById('wf-timer').textContent='タップで開始';
}
function beginBreath(){
  if(!wfWaiting) return;
  wfWaiting=false;
  document.getElementById('breath-disc').classList.remove('waiting');
  if(bgmOn) startSurf();   // 波の音はスタートしてからフェードイン
  runBreath(0,0);
}
// ---- 波音BGM: Web Audioでその場生成（音源ファイル不要・オフラインOK）----
let surf=null;
let bgmOn = localStorage.getItem('nagi-bgm')!=='off';
function startSurf(){
  if(surf) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    // ブラウンノイズ2秒ループ（波の素）
    const len=2*ctx.sampleRate, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650;
    const gain=ctx.createGain(); gain.gain.value=0.001;
    // うねり2本（周期違い）で「寄せて引く」を作る
    const mkLfo=(freq,depth)=>{ const o=ctx.createOscillator(); o.frequency.value=freq;
      const g=ctx.createGain(); g.gain.value=depth; o.connect(g); g.connect(gain.gain); o.start(); return o; };
    mkLfo(0.07,0.09); mkLfo(0.045,0.06);
    const base=ctx.createConstantSource(); base.offset.value=0.16; base.connect(gain.gain); base.start();
    // 急に鳴るとびびるので無音から指数カーブでフェードイン（12秒は遅すぎ・6秒は直線で急すぎたの中間=指数7秒）
    const master=ctx.createGain();
    master.gain.setValueAtTime(0.001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(1, ctx.currentTime+7);
    src.connect(lp); lp.connect(gain); gain.connect(master); master.connect(ctx.destination); src.start();
    surf={ctx};
  }catch(e){ surf=null; }
}
function stopSurf(){ if(surf){ try{surf.ctx.close()}catch(e){} surf=null; } }
function renderBgmBtn(){
  const b=document.getElementById('wf-bgm');
  document.getElementById('wf-bgm-ic').textContent = bgmOn ? '🔊' : '🔇';
  document.getElementById('wf-bgm-t').textContent = bgmOn ? '波の音 ON' : '波の音 OFF';
  b.classList.toggle('off', !bgmOn);
}
function toggleBgm(){
  bgmOn=!bgmOn; localStorage.setItem('nagi-bgm', bgmOn?'on':'off');
  renderBgmBtn();
  if(bgmOn && !wfWaiting) startSurf(); else if(!bgmOn) stopSurf();
}

// 勝手に終わらない: 波が引くまで何周でも回る。終わらせるのは本人だけ（ヨシ君FB 2026-08-17）
function runBreath(cycle, phaseIdx){
  const p = PHASES[phaseIdx];
  const disc = document.getElementById('breath-disc');
  disc.style.transition = `transform ${p.sec}s ease-in-out`;
  disc.style.transform = (p.cls==='out') ? 'scale(.5)' : 'scale(1)';   // 吸う=満ちる・とめる=満月・吐く=欠ける
  // 呼吸に合わせて海面が満ち引きする（吸う=満ちる・吐く=引く）
  document.getElementById('wf-waves').style.transform = (p.cls==='out') ? 'translateY(3vh)' : 'translateY(-3vh)';
  let left = p.sec;
  const count = document.getElementById('wf-count');
  document.getElementById('wf-word').textContent = p.label;
  document.getElementById('wf-timer').textContent = '';
  count.textContent = left;
  wfTimer = setInterval(()=>{
    left--;
    count.textContent = left>0 ? left : '';
    if(left<=0){
      clearInterval(wfTimer);
      const nextPhase = (phaseIdx+1)%3;
      runBreath(phaseIdx===2 ? cycle+1 : cycle, nextPhase);
    }
  },1000);
}
// 「大丈夫じゃないけど閉じたい」用: 記録せず静かに閉じる（凪画面も出さない）
function exitWave(){
  clearInterval(wfTimer);
  stopSurf();
  wfWaiting=false;
  document.getElementById('waveflow').classList.remove('active');
}
function endWave(skipped){
  clearInterval(wfTimer);
  stopSurf();
  wfWaiting=false;
  document.getElementById('waveflow').classList.remove('active');
  const sec = Math.round((Date.now()-wfStart)/1000);
  data.waves.push({t:Date.now(), sec});
  store.save(data);
  renderAutoFacts();
  const n = data.waves.length;
  document.getElementById('done-msg').innerHTML =
    `この波は <b>${sec}秒</b>で引いた。<br><b>${n}回目</b>。`;
  document.getElementById('wavedone').classList.add('active');
}
function closeDone(){
  document.getElementById('wavedone').classList.remove('active');
  renderToday();
}

// ---- mirror: 3-tap facts -> witnessed validation ----
const CHIP_DEFS = [
  {id:'work',   label:'仕事をした',       fact:'復職して、今日も働いた'},
  {id:'meet',   label:'人と話した',       fact:'誰かとちゃんと話した'},
  {id:'eat',    label:'ごはんを食べた',   fact:'自分の体に食べさせた'},
  {id:'out',    label:'外に出た',         fact:'外の空気を吸いに出た'},
  {id:'family', label:'家族と過ごした',   fact:'家族との時間を作った'},
  {id:'rest',   label:'ちゃんと休んだ',   fact:'休む勇気を出した'},
  {id:'sleep',  label:'眠れた',           fact:'体を休ませられた'},
  {id:'wave',   label:'波に耐えた',       fact:'消えたい波に呑まれなかった'},
];
function renderChips(){
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  CHIP_DEFS.forEach(c=>{
    const b = document.createElement('button');
    b.className='chip'; b.textContent=c.label; b.dataset.id=c.id;
    b.onclick=()=>b.classList.toggle('on');
    wrap.appendChild(b);
  });
}
function mirror(){
  const on = [...document.querySelectorAll('.chip.on')].map(b=>CHIP_DEFS.find(c=>c.id===b.dataset.id));
  const res = document.getElementById('mirror-result');
  const msg = document.getElementById('mirror-msg');
  if(on.length===0){
    msg.innerHTML = '<em>1日を終えた</em>。<br>うつの中では、それだけで体力を使う。';
  } else {
    const facts = on.map(c=>`<em>${c.fact}</em>`).join('。');
    msg.innerHTML = `${facts}。<br>息子が同じ状態でこれをやっていたら<br>「よくやってる」と言うはず。`;
  }
  data.days[todayKey()] = on.map(c=>c.id);
  store.save(data);
  res.classList.add('show');
  renderToday(); renderMirrorHistory(); renderAutoFacts();
}
// 「できたことを記録していきたい」→ 蓄積が見える履歴（ヨシ君FB 2026-08-17）
function renderMirrorHistory(){
  const wrap = document.getElementById('mirror-history');
  const keys = Object.keys(data.days).sort().reverse().slice(0,14);
  if(keys.length===0){ wrap.innerHTML=''; return; }
  const rows = keys.map(k=>{
    const labels = (data.days[k]||[]).map(id=>{const c=CHIP_DEFS.find(c=>c.id===id);return c?c.label:''}).filter(Boolean);
    const d = new Date(k+'T00:00:00');
    const ds = `${d.getMonth()+1}/${d.getDate()}`;
    return `<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px">
      <div style="width:38px;flex-shrink:0;font-weight:900;color:var(--accd)">${ds}</div>
      <div style="color:${labels.length?'var(--ink)':'#9aa2a9'}">${labels.length?labels.join('・'):'記録した'}</div></div>`;
  }).join('');
  wrap.innerHTML = `<div style="background:var(--card);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;margin-top:14px">
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;color:var(--accd);margin-bottom:4px">${ic('book',15)}これまでのできてるよ（${Object.keys(data.days).length}日分）</div>${rows}</div>`;
}
function calcStreak(){
  let s=0; const d=new Date();
  for(;;){
    const k=d.toISOString().slice(0,10);
    if(data.days[k]!==undefined){ s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}

// ---- facts (editable later; seeded from ep8) ----
const FACTS = [
  {icon:'work',  t:'休職から復職して、仕事を続けている'},
  {icon:'star',  t:'会社から評価をもらっている'},
  {icon:'house', t:'家族と、大きな家で暮らしている'},
  {icon:'money', t:'収入は同世代の平均より上にいる'},
  {icon:'wave',  t:'最悪の日を全部生き延びてきた'},
];
function renderFacts(){
  const custom = (data.customFacts||[]).map(t=>({icon:'pen', t}));
  const wrap = document.getElementById('facts');
  wrap.innerHTML = FACTS.concat(custom).map(f=>
    `<div class="fact"><div class="icon">${ic(f.icon,20)}</div><div class="t">${f.t}</div><div class="stamp">これは事実</div></div>`
  ).join('');
}
// 「日々の記録から増えていくといいな」→ 記録が実績として自動で事実化（ヨシ君FB 2026-08-17）
function renderAutoFacts(){
  const wrap = document.getElementById('facts-auto');
  const auto = [];
  const n = data.waves.length;
  const days = Object.keys(data.days).length;
  const streak = calcStreak();
  if(n>0) auto.push({icon:'wave', t:`消えたい波を ${n}回 乗り越えた（全部引いた）`});
  if(days>0) auto.push({icon:'mirror', t:`できたことを ${days}日分 記録してきた`});
  if(streak>=3) auto.push({icon:'fire', t:`${streak}日連続でチェックインしている`});
  const workDays = Object.values(data.days).filter(a=>a.includes('work')).length;
  if(workDays>=2) auto.push({icon:'work', t:`記録の中で ${workDays}日、仕事をやりきっている`});
  wrap.innerHTML = auto.map(f=>
    `<div class="fact auto"><div class="icon">${ic(f.icon,20)}</div><div class="t">${f.t}</div><div class="stamp">記録から自動</div></div>`
  ).join('');
}
function addFact(){
  const inp = document.getElementById('fact-in');
  const t = inp.value.trim(); if(!t) return;
  data.customFacts = data.customFacts||[];
  data.customFacts.push(t); store.save(data);
  inp.value=''; renderFacts();
}

// ---- log ----
function renderLog(){
  const n = data.waves.length;
  document.getElementById('st-count').textContent = n;
  document.getElementById('st-streak').textContent = calcStreak();
  document.getElementById('st-pct').textContent = n>0 ? '100%' : '—';
  document.getElementById('st-note').textContent = n>0 ? 'これまで全部引いている。' : '';
  // simple bar chart of wave durations (last 14)
  const waves = data.waves.slice(-14);
  const max = Math.max(60, ...waves.map(w=>w.sec));
  const bars = waves.map(w=>{
    const h = Math.max(8, Math.round(w.sec/max*80));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:70%;height:${h}px;background:var(--bar);border-radius:4px 4px 0 0"></div>
      <div style="font-size:9px;color:var(--sub)">${w.sec}s</div></div>`;
  }).join('');
  document.getElementById('chart').innerHTML = n===0
    ? '<div style="font-size:13px;color:var(--sub);text-align:center;padding:20px 0">まだ記録はありません。</div>'
    : `<div style="display:flex;align-items:flex-end;height:110px;gap:2px">${bars}</div>
       <div style="font-size:11px;color:var(--sub);text-align:center;margin-top:8px">波が引くまでの秒数（最近${waves.length}回）</div>`;
}

// ---- feedback ----
const FB_KEY='nagi-fb-app';
const FB_SECS=[
  {id:'全体の第一印象', hint:'開いた瞬間どう感じたか'},
  {id:'波ボタン', hint:'しんどい瞬間に押せそうか'},
  {id:'できてるよミラー', hint:'この言われ方は響くか'},
  {id:'事実の鏡', hint:'事実を見せられてどう感じたか'},
  {id:'波ログ', hint:'「全部引いた」の見せ方はどうか'},
  {id:'足りないもの・欲しいもの', hint:'「本当はこうだったら」を自由に'},
];
const fbDraft=(()=>{try{return JSON.parse(localStorage.getItem(FB_KEY))||{}}catch(e){return{}}})();
function fbSave(){localStorage.setItem(FB_KEY,JSON.stringify(fbDraft))}
function renderFb(){
  const wrap=document.getElementById('fb-list');
  wrap.innerHTML='';
  FB_SECS.forEach(s=>{
    const d=document.createElement('div');
    d.style.cssText='background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px';
    d.innerHTML=`<label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--accd);margin-bottom:8px">${ic('note',15)}${s.id}</label>
      <textarea data-sec="${s.id}" placeholder="${s.hint}" style="width:100%;min-height:64px;border:1px solid #dfe6ec;border-radius:12px;padding:10px;font-family:inherit;font-size:14px;line-height:1.8;background:#fff;resize:vertical;color:var(--ink)"></textarea>`;
    const ta=d.querySelector('textarea');
    ta.value=fbDraft[s.id]||'';
    ta.addEventListener('input',()=>{fbDraft[s.id]=ta.value;fbSave()});
    wrap.appendChild(d);
  });
  document.getElementById('fb-name').value=fbDraft._name||'';
  document.getElementById('fb-name').addEventListener('input',e=>{fbDraft._name=e.target.value;fbSave()});
}
function fbBuild(){
  const name=(fbDraft._name||'').trim()||'（無記名）';
  const date=new Date().toLocaleDateString('ja-JP');
  let body='';
  FB_SECS.forEach(s=>{ const v=(fbDraft[s.id]||'').trim(); if(v) body+=`■ ${s.id}\n${v}\n\n`; });
  if(!body) body='（コメントなし）\n\n';
  return `以下は、うつ当事者向けアプリ試作「ナギ」を実際に触った当事者本人からのフィードバックです。\nコメントは原文のまま尊重して、①刺さった点 ②「違う感」の正体の仮説 ③次に直すべき最重要の1点 の順で分析し、改善版の仕様を提案してください。\n\n【ナギ フィードバック / アプリ】${date}\n書いた人: ${name}\n\n${body}--- 以上 ---`;
}
function fbOpen(){
  document.getElementById('fb-out').value=fbBuild();
  document.getElementById('fb-result').style.display='block';
}
async function fbCopy(btn){
  const t=fbBuild();
  try{await navigator.clipboard.writeText(t)}catch(e){
    const ta=document.getElementById('fb-out'); ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly','');
  }
  const lab=btn.querySelector('span');
  lab.textContent='コピーした'; setTimeout(()=>lab.textContent='コピー',1600);
}
async function fbShare(){
  const t=fbBuild();
  if(navigator.share){ try{await navigator.share({text:t})}catch(e){} }
  else{ fbCopy(document.getElementById('fb-copy')); alert('この端末は共有メニュー非対応のため、コピーしました。LINE等に貼ってください。'); }
}

// ---- init ----
renderToday(); renderChips(); renderFacts(); renderAutoFacts(); renderMirrorHistory(); renderFb();

// ---- self-check (run ?test=1) ----
if(location.search.includes('test=1')){
  console.assert(typeof store.load()==='object', 'store loads');
  data={waves:[],days:{}}; data.waves.push({t:1,sec:57});
  console.assert(data.waves.length===1, 'wave recorded');
  data.days[todayKey()]=['work'];
  console.assert(calcStreak()===1, 'streak counts today');
  console.assert(getComputedStyle(document.querySelector('.today-msg')).boxShadow.includes('rgba(90, 120, 150'), 'soft shadow applied');
  console.assert(document.documentElement.scrollWidth<=window.innerWidth, 'no h-scroll');
  console.log('nagi self-check OK');
}
</script>
</body>
