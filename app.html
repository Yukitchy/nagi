<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ナギ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ========= Glow スタイル（glow.app の骨格に準拠） =========
   骨格: ①数値ヒーロー（小ラベル→特大の数字） ②カードでなく罫線でセクションを割る
         ③リスト行は「円アイコン＋主/副」←→「値/状態」の左右振り分け ④影ゼロ・面色と余白で分離
   ラテン/数字は Manrope（Roobert は商用非公開のため最も近い幾何学グロテスクで代替）、日本語は Zen Kaku Gothic New。 */
:root{
  --bg:#ffffff;        /* アプリの地は白（glow.appのアプリ画面を実測: #ffffff） */
  --card:#f4f5f6;      /* Porcelain: 白地に乗る面・円アイコン・チップ */
  --ink:#131517;       /* 文字・罫線・アイコン。構造を担う中立色 */
  --sub:#737577;       /* Stone: 本文グレー */
  --acc:#cc62d5;       /* Voltage Magenta: 主要CTA専用・1画面に1つだけ */
  --accd:#131517;      /* 見出しは黒。色は付けない */
  --acc-soft:#eccff0; --acc-tint:#fbf3fc;
  --line:#e4e5e6; --hair:#eeeff0;
  --graphite:#333537;
  --ember:#ec660d;     /* バッジの印。第二のブランド色にはしない */
  --ok:#1a9c62;        /* 意味色: 事実の確証・達成（機能なので残す） */
  --shadow:none;       /* Glowは意図的にフラット。影は足さない */
  --bar:#131517;
  --radius:24px;       /* カード */
  --r-btn:19px;        /* Glowの署名的な半ピル */
  --gap:12px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope','Zen Kaku Gothic New',sans-serif; background:#e9eaeb; color:var(--ink);
  display:flex; justify-content:center; align-items:flex-start;
  line-height:1.7; overflow-wrap:break-word; word-break:auto-phrase;
}
#phone{
  width:100%; max-width:430px; min-height:100vh; background:var(--bg);
  display:flex; flex-direction:column; position:relative;
}
main{flex:1; padding:8px 18px 96px; overflow-y:auto}
.screen{display:none}
.screen.active{display:block; animation:fadein .3s var(--ease-out)}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.emo{line-height:1; font-style:normal}
.li{display:block; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round}
.num{font-family:'Manrope',sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.04em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header — Glowのアプリは大見出しを置かない。小さなワードマークだけ */
header{padding:18px 20px 2px; display:flex; align-items:center; justify-content:space-between}
header h1{font-size:19px; font-weight:800; letter-spacing:-.03em; color:var(--ink)}
header .sub{font-size:11px; color:var(--sub); font-weight:500}

/* home — 数値ヒーロー（Glowの残高表示の骨格） */
.hero{text-align:center; padding:14px 0 20px}
.hero .lab{font-size:12px; font-weight:500; color:var(--sub)}
.hero .n{display:block; font-family:'Manrope',sans-serif; font-variant-numeric:tabular-nums;
  font-size:56px; font-weight:800; letter-spacing:-.045em; color:var(--ink); line-height:1.08; margin-top:2px}
.hero .n .u{font-size:22px; font-weight:700; letter-spacing:-.01em; margin-left:3px}
.today-msg{font-size:13px; color:var(--sub); line-height:1.8; margin-top:8px}
.today-msg b{color:var(--ink); font-weight:700}

/* 主要CTA: この画面で唯一のマゼンタ */
.wave-btn{
  width:100%; border:none; cursor:pointer; border-radius:var(--r-btn);
  background:var(--acc); color:#fff; padding:15px 20px 13px; text-align:center;
  font-family:inherit; margin-bottom:20px;
  transition:transform .12s var(--spring), background-color .12s ease;
}
.wave-btn:active{transform:scale(.985); background:#bb50c4}
.wave-btn .big{font-size:16px; font-weight:700; letter-spacing:-.01em;
  display:flex; align-items:center; justify-content:center; gap:9px}
.wave-btn .small{font-size:12px; font-weight:500; opacity:.82; margin-top:2px}

/* クイック — Glowの Buy/Send/Swap 行（円アイコン＋ラベル横並び・影なし） */
.quickrow{display:flex; justify-content:center; gap:20px; padding-bottom:22px}
.quick{
  background:none; border:none; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; gap:8px; padding:0;
  font-size:13px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
}
.quick svg{
  width:40px; height:40px; padding:11px; box-sizing:border-box;
  border-radius:50%; background:var(--card); color:var(--ink); flex:none;
  transition:transform .12s var(--spring);
}
.quick:active svg{transform:scale(.92)}

/* wave flow — 海の中にいる状態を表す面。意味色なので深い青は残し、グラデだけ廃してベタに */
#waveflow{
  position:fixed; inset:0; background:#1d3d52;
  color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px; z-index:50; overflow:hidden;
}
#waveflow.active{display:flex}
#wf-bgm{
  position:absolute; top:20px; right:18px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.34); color:#fff;
  border-radius:var(--r-btn); padding:9px 15px; font-family:inherit; font-size:12px; font-weight:700;
  letter-spacing:-.01em; cursor:pointer; display:flex; align-items:center; gap:6px;
  transition:transform .12s var(--spring);
}
#wf-bgm:active{transform:scale(.96)}
#wf-bgm.off{opacity:.5}
#wf-back{
  position:absolute; top:20px; left:18px;
  background:none; border:none; color:rgba(255,255,255,.7);
  font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:9px 10px;
}
/* 円だけが満ち欠けし、数字は常に同じ大きさ（文字を変形させない） */
#breath-circle{
  position:relative; width:190px; height:190px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.34);
  display:grid; place-items:center; margin-bottom:24px;
}
#breath-disc{
  grid-area:1/1; width:100%; height:100%; border-radius:50%;
  background:rgba(255,255,255,.14); transform:scale(.5);
}
#breath-disc.waiting{cursor:pointer}
#wf-count{
  grid-area:1/1; z-index:2; pointer-events:none;
  font-family:'Manrope',sans-serif; font-variant-numeric:tabular-nums;
  font-size:58px; font-weight:800; letter-spacing:-.045em; color:#fff; line-height:1;
}
#breath-disc.waiting ~ #wf-count{font-size:20px; font-weight:700; letter-spacing:-.01em}
#wf-word{font-size:22px; font-weight:700; letter-spacing:-.02em; margin-top:2px; min-height:32px}
#waveflow .timer{font-size:13px; opacity:.7; margin-top:12px}
#waveflow .skip{
  margin-top:28px; background:none; border:1px solid rgba(255,255,255,.4); color:#fff;
  border-radius:var(--r-btn); padding:11px 24px; font-family:inherit; font-size:13px; font-weight:700;
  letter-spacing:-.01em; cursor:pointer; display:flex; align-items:center; gap:7px;
  transition:transform .12s var(--spring);
}
#waveflow .skip:active{transform:scale(.97)}
#wavedone{display:none; position:fixed; inset:0; background:var(--bg); z-index:51;
  flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px}
#wavedone.active{display:flex}
#wavedone .nagi{color:var(--ink); margin-bottom:14px}
#wavedone h2{font-size:24px; font-weight:800; letter-spacing:-.03em; color:var(--ink); margin-bottom:10px}
#wavedone p{font-size:13px; color:var(--sub); margin-bottom:26px; line-height:1.8}
#wavedone p b{color:var(--ink); font-weight:700}

/* ボタン: filledマゼンタは1画面に1つ。並べる時の相方はインクのゴースト */
.btn-primary{
  background:var(--acc); color:#fff; border:none; border-radius:var(--r-btn);
  padding:14px 32px; font-family:inherit; font-size:15px; font-weight:700; letter-spacing:-.01em;
  cursor:pointer; transition:transform .12s var(--spring), background-color .12s ease;
}
.btn-primary:active{transform:scale(.985); background:#bb50c4}
.btn-ink{background:var(--ink)}
.btn-ink:active{background:var(--graphite,#333537)}
.btn-ghost{
  background:none; color:var(--ink); border:1.5px solid var(--ink); border-radius:var(--r-btn);
  padding:12.5px 30px; font-family:inherit; font-size:15px; font-weight:700; letter-spacing:-.01em;
  cursor:pointer; transition:transform .12s var(--spring), background-color .12s ease;
}
.btn-ghost:active{transform:scale(.985); background:rgba(19,21,23,.06)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

/* セクション — Glowの「Coins ⟷ All ›」の行 */
.section-title{font-size:17px; font-weight:800; letter-spacing:-.025em; margin:6px 0 2px; color:var(--ink);
  display:flex; align-items:center; gap:8px}
.section-title .more{margin-left:auto; font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--sub)}
.section-lead{font-size:12px; color:var(--sub); margin-bottom:16px; line-height:1.7}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
.chip{
  background:var(--card); border:1.5px solid transparent; border-radius:99px;
  padding:9px 15px; font-family:inherit; font-size:13px; font-weight:600; letter-spacing:-.01em;
  color:var(--ink); cursor:pointer;
  transition:transform .12s var(--spring), background-color .12s ease, color .12s ease;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
#mirror-result{
  display:none; background:var(--card); border-radius:var(--radius);
  padding:20px; margin-top:10px;
}
#mirror-result.show{display:block; animation:fadein .3s var(--ease-out)}
#mirror-result .who{font-size:11px; color:var(--sub); margin-bottom:8px}
#mirror-result .msg{font-size:15px; font-weight:600; line-height:1.9; letter-spacing:-.01em}
#mirror-result .msg em{font-style:normal; font-weight:800; border-bottom:2px solid var(--acc-soft)}

/* 事実 — Glowのコインリスト行（カードをやめ、罫線で割る。左右振り分け） */
.fact{
  background:none; border-radius:0; box-shadow:none;
  padding:11px 0; margin-bottom:0;
  display:flex; align-items:center; gap:13px;
}
/* Glowは行間に線を引かず、セクションの外側にだけ1本引く */
#facts-auto:not(:empty), #facts:not(:empty){
  border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); margin-top:-1px;
}
.fact .icon{
  width:40px; height:40px; border-radius:50%; background:var(--ink); color:#fff;
  display:grid; place-items:center; flex:none; line-height:1;
}
.fact .icon .li{stroke-width:1.6; width:21px; height:21px}
.fact .t{font-size:15px; font-weight:700; letter-spacing:-.01em; flex:1; min-width:0}
.fact .stamp{
  font-size:12px; font-weight:700; letter-spacing:-.01em; color:var(--ok);
  border:none; border-radius:0; padding:0; white-space:nowrap; transform:none;
}
.fact.auto{background:none}
.fact.auto .icon{background:var(--ember)}
.fact.auto .stamp{color:var(--ember)}
.txt-in{border:1px solid var(--line); border-radius:var(--r-btn); padding:12px 13px;
  font-family:inherit; font-size:13px; color:var(--ink); background:var(--card)}
.txt-in::placeholder{color:#a9abad}

/* log */
#chart{background:none; border-radius:0; box-shadow:none; padding:18px 0; border-bottom:1px solid var(--hair)}
.stat-row{display:flex; gap:0; margin:2px 0 20px; padding-bottom:20px; border-bottom:1px solid var(--line)}
.stat{flex:1; background:none; border-radius:0; box-shadow:none; padding:0; text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat .num{font-family:'Manrope',sans-serif; font-variant-numeric:tabular-nums;
  font-size:38px; font-weight:800; letter-spacing:-.045em; color:var(--ink); line-height:1.15}
.stat .lab{font-size:11px; color:var(--sub); margin-top:2px}
.survive{
  background:none; color:var(--sub); border-radius:0;
  padding:22px 0 4px; font-size:12px; font-weight:500; line-height:1.8; text-align:center;
}
.survive .pct{display:block; font-family:'Manrope',sans-serif; font-variant-numeric:tabular-nums;
  font-size:46px; font-weight:800; letter-spacing:-.045em; color:var(--ink); line-height:1.15; margin:2px 0}

/* nav — アイコンのみ。アクティブが黒、それ以外はグレー */
nav{
  position:absolute; bottom:0; left:0; right:0; background:var(--bg);
  display:flex; border-top:1px solid var(--line); padding:9px 6px calc(11px + env(safe-area-inset-bottom));
}
nav button{
  flex:1; background:none; border:none; font-family:inherit; cursor:pointer;
  font-size:10px; font-weight:600; letter-spacing:-.01em; color:var(--sub); padding:5px 0;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}

nav button .li{width:22px; height:22px; opacity:.32; transition:opacity .12s ease}
nav button.on{color:var(--ink); font-weight:700}

nav button.on .li{opacity:1}

/* help footer — Signal Red は支えの淡いwashとして。ステータス色には使わない */
.helpline{
  margin-top:26px; padding:16px 18px; border-radius:var(--radius);
  background:#fdf0f1; font-size:11px; color:#8d4a50; line-height:1.9;
}
.helpline b{display:block; font-size:12px; color:#e83b47; margin-bottom:1px}
.disclaimer{font-size:10px; color:#a9abad; margin-top:12px; text-align:center; line-height:1.7}
</style>
</head>
<body>
<!-- アイコン: Glowのリストアイコン（ベタ1色の円＋白いシンボル）に合わせた線画スプライト -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-wave" viewBox="0 0 20 20"><path d="M2 13c2.7-4 5.3 4 8 0s5.3 4 8 0"/><path d="M2 8c2.7-4 5.3 4 8 0s5.3 4 8 0"/></symbol>
  <symbol id="i-mirror" viewBox="0 0 20 20"><ellipse cx="10" cy="8" rx="5.5" ry="6.5"/><path d="M10 14.5V18"/><path d="M7.5 18h5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3"/><path d="M10 9.5V17"/></symbol>
  <symbol id="i-chart" viewBox="0 0 20 20"><path d="M3 17V10"/><path d="M9 17V4"/><path d="M15 17v-5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 20 20"><path d="M3.5 16.5l3.2-.8 9-9-2.4-2.4-9 9z"/><path d="M13 5.5l2.4 2.4"/></symbol>
  <symbol id="i-beach" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3"/><path d="M3 14.5c2.3-2.5 4.7 2.5 7 0s4.7 2.5 7 0"/></symbol>
  <symbol id="i-sound" viewBox="0 0 20 20"><path d="M4 8h3l4-3v10l-4-3H4z"/><path d="M14 7.2c1.4 1.6 1.4 4 0 5.6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 20 20"><path d="M4 8h3l4-3v10l-4-3H4z"/><path d="M14 8l4 4"/><path d="M18 8l-4 4"/></symbol>
  <symbol id="i-book" viewBox="0 0 20 20"><rect x="4" y="3.5" width="12" height="13" rx="1.2"/><path d="M8 3.5v13"/></symbol>
  <symbol id="i-work" viewBox="0 0 20 20"><rect x="3" y="7" width="14" height="9" rx="1.2"/><path d="M7.5 7V5h5v2"/></symbol>
  <symbol id="i-star" viewBox="0 0 20 20"><path d="M10 3.2l2.1 4.5 4.7.5-3.5 3.2 1 4.6L10 13.7l-4.3 2.3 1-4.6L3.2 8.2l4.7-.5z"/></symbol>
  <symbol id="i-house" viewBox="0 0 20 20"><path d="M3 9l7-5.5L17 9v8H3z"/><path d="M8 17v-4.5h4V17"/></symbol>
  <symbol id="i-money" viewBox="0 0 20 20"><path d="M3 16.5h14"/><rect x="4" y="9" width="3" height="6"/><rect x="9" y="5" width="3" height="10"/><rect x="14" y="11" width="3" height="4"/></symbol>
  <symbol id="i-fire" viewBox="0 0 20 20"><path d="M10 3c2.8 3.6 4.6 5 4.6 8a4.6 4.6 0 01-9.2 0c0-2 1.7-3 2.7-4.7.5 1 1 1.5 1.9 2 .4-2 0-3.6 0-5.3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></symbol>
  <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="3.5" width="9.5" height="9.5" rx="1.2"/><path d="M13 15.5v1a1.2 1.2 0 01-1.2 1.2H4.7A1.2 1.2 0 013.5 16.5V7.7A1.2 1.2 0 014.7 6.5h1"/></symbol>
  <symbol id="i-share" viewBox="0 0 20 20"><path d="M10 13.5V3.5"/><path d="M6.5 7L10 3.5 13.5 7"/><path d="M4.5 12v4.5h11V12"/></symbol>
  <symbol id="i-note" viewBox="0 0 20 20"><rect x="3.5" y="4" width="13" height="12" rx="1.2"/><path d="M6.5 8h7"/><path d="M6.5 11.5h4.5"/></symbol>
</defs></svg>
<div id="phone">
  <header><h1>ナギ</h1></header>
  <main>

    <!-- HOME -->
    <section class="screen active" id="scr-home">
      <div class="hero">
        <div class="lab">乗り越えた波</div>
        <span class="n" id="hero-num">0<span class="u">回</span></span>
        <div class="today-msg" id="today-msg"></div>
      </div>
      <button class="wave-btn" onclick="startWave()">
        <div class="big"><svg class="li" width="20" height="20"><use href="#i-wave"/></svg>波が来た</div>
        <div class="small">深呼吸する</div>
      </button>
      <div class="quickrow">
        <button class="quick" onclick="go('mirror')"><svg class="li" width="18" height="18"><use href="#i-mirror"/></svg>今日のできてるよ</button>
        <button class="quick" onclick="go('facts')"><svg class="li" width="18" height="18"><use href="#i-pin"/></svg>事実の鏡</button>
      </div>
      <div class="helpline">
        <b>つらいときの相談先</b>
        いのちの電話 0570-064-556<br>
        よりそいホットライン 0120-279-338<br>
        24時間・無料
      </div>
      <div class="disclaimer">ナギは医療機器ではありません。<br>記録は端末の中だけに保存されます。</div>
    </section>

    <!-- MIRROR -->
    <section class="screen" id="scr-mirror">
      <div class="section-title">今日のできてるよ<span class="more" id="more-今日"></span></div>
      <div class="section-lead">今日あったことをタップする。</div>
      <div class="chips" id="chips"></div>
      <button class="btn-primary" style="width:100%" onclick="mirror()">ミラーに映す</button>
      <div id="mirror-result">
        <div class="who">— これが息子の1日だったら —</div>
        <div class="msg" id="mirror-msg"></div>
      </div>
      <div id="mirror-history"></div>
    </section>

    <!-- FACTS -->
    <section class="screen" id="scr-facts">
      <div class="section-title">事実の鏡<span class="more" id="more-事実"></span></div>
      <div class="section-lead">事実だけを置く場所。<br>記録から自動で増える。</div>
      <div id="facts-auto"></div>
      <div id="facts"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <input id="fact-in" class="txt-in" placeholder="事実を追加（例: 息子と公園に行った）" style="flex:1;min-width:0">
        <button class="btn-primary" style="padding:11px 18px;font-size:13px" onclick="addFact()">追加</button>
      </div>
    </section>

    <!-- LOG -->
    <section class="screen" id="scr-log">
      <div class="section-title">波ログ<span class="more" id="more-波ロ"></span></div>
      <div class="section-lead">記録した波の一覧。</div>
      <div class="stat-row">
        <div class="stat"><div class="num" id="st-count">0</div><div class="lab">乗り越えた波</div></div>
        <div class="stat"><div class="num" id="st-streak">0</div><div class="lab">連続チェックイン日数</div></div>
      </div>
      <div id="chart"></div>
      <div class="survive">
        来た波が引いた確率<br>
        <span class="pct" id="st-pct">—</span><br>
        <span id="st-note" style="font-size:12px;font-weight:500;color:var(--sub)"></span>
      </div>
    </section>

    <!-- FEEDBACK -->
    <section class="screen" id="scr-fb">
      <div class="section-title">感想（ヨシ君用）<span class="more" id="more-感想"></span></div>

<!-- WAVE FLOW -->
<div id="waveflow">
  <button id="wf-back" onclick="exitWave()">← 戻る</button>
  <button id="wf-bgm" onclick="toggleBgm()"><span id="wf-bgm-ic"><svg class="li" width="15" height="15"><use href="#i-sound"/></svg></span><span id="wf-bgm-t">波の音 ON</span></button>
  <div id="breath-circle"><div id="breath-disc" onclick="beginBreath()"></div><span id="wf-count"></span></div>
  <div id="wf-word"></div>
  <div class="timer" id="wf-timer"></div>
  <button class="skip" onclick="endWave(true)"><svg class="li" width="44" height="44"><use href="#i-beach"/></svg>もう大丈夫</button>
</div>
<div id="wavedone">
  <div class="nagi">🏖️</div>
  <h2>凪</h2>
  <p id="done-msg"></p>
  <button class="btn-primary" onclick="closeDone()">ホームへ戻る</button>
</div>

<script>
// ---- storage ----
const store = {
  get k(){ return 'nagi-v1'; },
  load(){ try{ return JSON.parse(localStorage.getItem(this.k))||{waves:[],days:{}} }catch(e){ return {waves:[],days:{}} } },
  save(d){ localStorage.setItem(this.k, JSON.stringify(d)); }
};
let data = store.load();
const todayKey = () => new Date().toISOString().slice(0,10);
const EMO = {wave:'🌊',mirror:'🪞',pin:'📌',chart:'📈',pen:'✍️',beach:'🏖️',sound:'🔊',mute:'🔇',
  book:'📚',work:'💼',star:'⭐',house:'🏠',money:'📊',fire:'🔥',check:'✅',copy:'📋',share:'📤',note:'📝'};
const ic = (n,sz) => `<svg class="li" width="${sz}" height="${sz}"><use href="#i-${n}"/></svg>`;

// ---- nav ----
function go(s){
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
  document.getElementById('scr-'+s).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===s));
  if(s==='log') renderLog();
}

// ---- home message (self-distancing / no empty praise) ----
function renderToday(){
  const n = data.waves.length;
  const el = document.getElementById('today-msg');
  const streak = calcStreak();
  document.getElementById('hero-num').innerHTML = `${n}<span class="u">回</span>`;
  el.innerHTML = (n===0 && streak===0)
    ? '波が来たら下のボタンを押す。<br>それ以外の時間は使わなくて大丈夫。'
    : `連続チェックイン <b>${streak}日</b>。`;
}

// ---- wave flow: 4-7-8呼吸 ×3 + urge surfing copy ----
let wfTimer=null, wfStart=0;
const PHASES = [
  {label:'吸って', cls:'in',  sec:4},
  {label:'とめて', cls:'hold',sec:7},
  {label:'吐いて', cls:'out', sec:8},
];
let wfWaiting=false;
// 開いた直後は始めない: スタート待機で自分のペースで始められる
function startWave(){
  document.getElementById('waveflow').classList.add('active');
  wfStart = Date.now();
  renderBgmBtn();
  wfWaiting=true;
  const disc=document.getElementById('breath-disc');
  disc.classList.add('waiting');
  disc.style.transition='transform .3s ease';
  disc.style.transform='scale(.72)';
  document.getElementById('wf-count').textContent='スタート';
  document.getElementById('wf-word').textContent='';
  document.getElementById('wf-timer').textContent='タップで開始';
}
function beginBreath(){
  if(!wfWaiting) return;
  wfWaiting=false;
  document.getElementById('breath-disc').classList.remove('waiting');
  if(bgmOn) startSurf();   // 波の音はスタートしてからフェードイン
  runBreath(0,0);
}
// ---- 波音BGM: Web Audioでその場生成（音源ファイル不要・オフラインOK）----
let surf=null;
let bgmOn = localStorage.getItem('nagi-bgm')!=='off';
// 波の音: iOSは消音スイッチでWeb Audioの音が消えるため、WAVを生成して<audio>要素で鳴らす
let surfUrls=null;
function makeWav(sec, fadeIn){
  const sr=22050, n=Math.floor(sr*sec), xf=Math.floor(sr*0.5);   // 末尾0.5秒を頭にクロスフェード=継ぎ目なしループ
  const raw=new Float32Array(n+xf);
  let last=0, lp=0;
  for(let i=0;i<raw.length;i++){
    const w=Math.random()*2-1;
    last=(last+0.02*w)/1.02;          // ブラウンノイズ
    lp += (last*3.5 - lp)*0.08;       // ローパス（こもった波の音）
    const t=i/sr;
    const swell=0.16 + 0.09*Math.sin(2*Math.PI*0.07*t) + 0.06*Math.sin(2*Math.PI*0.045*t);
    raw[i]=lp*swell;
  }
  const out=new Float32Array(n);
  for(let i=0;i<n;i++) out[i]=raw[i];
  for(let i=0;i<xf;i++){ const k=i/xf; out[i]=out[i]*k + raw[n+i]*(1-k); }
  if(fadeIn) for(let i=0;i<n;i++){ const k=Math.min(1,i/(sr*fadeIn)); out[i]*=k*k; }  // 指数っぽい立ち上がり
  const buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const str=(o,t)=>{for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i))};
  str(0,'RIFF'); v.setUint32(4,36+n*2,true); str(8,'WAVEfmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2, Math.max(-1,Math.min(1,out[i]))*32767, true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function startSurf(){
  if(surf) return;
  try{
    if(!surfUrls) surfUrls={intro:makeWav(9,7), loop:makeWav(12,0)};   // 9秒の頭出し（7秒フェードイン）→12秒ループ
    const a=new Audio(surfUrls.intro);
    a.playsInline=true; a.preload='auto';
    a.addEventListener('ended',()=>{ if(!surf) return; a.src=surfUrls.loop; a.loop=true; a.play().catch(()=>{}); });
    surf={a};
    a.play().catch(err=>{ surf=null; bgmFailed(); });
  }catch(e){ surf=null; bgmFailed(); }
}
function bgmFailed(){
  const t=document.getElementById('wf-bgm-t');
  if(t){ t.textContent='音が出ません'; setTimeout(renderBgmBtn,4000); }
}
function stopSurf(){ if(surf){ try{ surf.a.pause(); surf.a.src=''; }catch(e){} surf=null; } }
function renderBgmBtn(){
  const b=document.getElementById('wf-bgm');
  document.getElementById('wf-bgm-ic').innerHTML = ic(bgmOn?'sound':'mute',15);
  document.getElementById('wf-bgm-t').textContent = bgmOn ? '波の音 ON' : '波の音 OFF';
  b.classList.toggle('off', !bgmOn);
}
function toggleBgm(){
  bgmOn=!bgmOn; localStorage.setItem('nagi-bgm', bgmOn?'on':'off');
  renderBgmBtn();
  if(bgmOn && !wfWaiting) startSurf(); else if(!bgmOn) stopSurf();
}

// 勝手に終わらない: 波が引くまで何周でも回る。終わらせるのは本人だけ（ヨシ君FB 2026-08-17）
function runBreath(cycle, phaseIdx){
  const p = PHASES[phaseIdx];
  const disc = document.getElementById('breath-disc');
  disc.style.transition = `transform ${p.sec}s ease-in-out`;
  disc.style.transform = (p.cls==='out') ? 'scale(.5)' : 'scale(1)';   // 吸う=満ちる・とめる=満月・吐く=欠ける
  let left = p.sec;
  const count = document.getElementById('wf-count');
  document.getElementById('wf-word').textContent = p.label;
  document.getElementById('wf-timer').textContent = '';
  count.textContent = left;
  wfTimer = setInterval(()=>{
    left--;
    count.textContent = left>0 ? left : '';
    if(left<=0){
      clearInterval(wfTimer);
      const nextPhase = (phaseIdx+1)%3;
      runBreath(phaseIdx===2 ? cycle+1 : cycle, nextPhase);
    }
  },1000);
}
// 「大丈夫じゃないけど閉じたい」用: 記録せず静かに閉じる（凪画面も出さない）
function exitWave(){
  clearInterval(wfTimer);
  stopSurf();
  wfWaiting=false;
  document.getElementById('waveflow').classList.remove('active');
}
function endWave(skipped){
  clearInterval(wfTimer);
  stopSurf();
  wfWaiting=false;
  document.getElementById('waveflow').classList.remove('active');
  const sec = Math.round((Date.now()-wfStart)/1000);
  data.waves.push({t:Date.now(), sec});
  store.save(data);
  renderAutoFacts();
  const n = data.waves.length;
  document.getElementById('done-msg').innerHTML =
    `この波は <b>${sec}秒</b>で引いた。<br><b>${n}回目</b>。`;
  document.getElementById('wavedone').classList.add('active');
}
function closeDone(){
  document.getElementById('wavedone').classList.remove('active');
  renderToday();
}

// ---- mirror: 3-tap facts -> witnessed validation ----
const CHIP_DEFS = [
  {id:'work',   label:'仕事をした',       fact:'復職して、今日も働いた'},
  {id:'meet',   label:'人と話した',       fact:'誰かとちゃんと話した'},
  {id:'eat',    label:'ごはんを食べた',   fact:'自分の体に食べさせた'},
  {id:'out',    label:'外に出た',         fact:'外の空気を吸いに出た'},
  {id:'family', label:'家族と過ごした',   fact:'家族との時間を作った'},
  {id:'rest',   label:'ちゃんと休んだ',   fact:'休む勇気を出した'},
  {id:'sleep',  label:'眠れた',           fact:'体を休ませられた'},
  {id:'wave',   label:'波に耐えた',       fact:'消えたい波に呑まれなかった'},
];
function renderChips(){
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  CHIP_DEFS.forEach(c=>{
    const b = document.createElement('button');
    b.className='chip'; b.textContent=c.label; b.dataset.id=c.id;
    b.onclick=()=>b.classList.toggle('on');
    wrap.appendChild(b);
  });
}
function mirror(){
  const on = [...document.querySelectorAll('.chip.on')].map(b=>CHIP_DEFS.find(c=>c.id===b.dataset.id));
  const res = document.getElementById('mirror-result');
  const msg = document.getElementById('mirror-msg');
  if(on.length===0){
    msg.innerHTML = '<em>1日を終えた</em>。<br>うつの中では、それだけで体力を使う。';
  } else {
    const facts = on.map(c=>`<em>${c.fact}</em>`).join('。');
    msg.innerHTML = `${facts}。<br>息子が同じ状態でこれをやっていたら<br>「よくやってる」と言うはず。`;
  }
  data.days[todayKey()] = on.map(c=>c.id);
  store.save(data);
  res.classList.add('show');
  renderToday(); renderMirrorHistory(); renderAutoFacts();
}
// 「できたことを記録していきたい」→ 蓄積が見える履歴（ヨシ君FB 2026-08-17）
function renderMirrorHistory(){
  const wrap = document.getElementById('mirror-history');
  const keys = Object.keys(data.days).sort().reverse().slice(0,14);
  if(keys.length===0){ wrap.innerHTML=''; return; }
  const rows = keys.map(k=>{
    const labels = (data.days[k]||[]).map(id=>{const c=CHIP_DEFS.find(c=>c.id===id);return c?c.label:''}).filter(Boolean);
    const d = new Date(k+'T00:00:00');
    const ds = `${d.getMonth()+1}/${d.getDate()}`;
    return `<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px">
      <div style="width:38px;flex-shrink:0;font-weight:900;color:var(--accd)">${ds}</div>
      <div style="color:${labels.length?'var(--ink)':'#9aa2a9'}">${labels.length?labels.join('・'):'記録した'}</div></div>`;
  }).join('');
  wrap.innerHTML = `<div style="background:var(--card);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;margin-top:14px">
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;color:var(--accd);margin-bottom:4px">${ic('book',15)}これまでのできてるよ（${Object.keys(data.days).length}日分）</div>${rows}</div>`;
}
function calcStreak(){
  let s=0; const d=new Date();
  for(;;){
    const k=d.toISOString().slice(0,10);
    if(data.days[k]!==undefined){ s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}

// ---- facts (editable later; seeded from ep8) ----
const FACTS = [
  {icon:'work',  t:'休職から復職して、仕事を続けている'},
  {icon:'star',  t:'会社から評価をもらっている'},
  {icon:'house', t:'家族と、大きな家で暮らしている'},
  {icon:'money', t:'収入は同世代の平均より上にいる'},
  {icon:'wave',  t:'最悪の日を全部生き延びてきた'},
];
function renderFacts(){
  const custom = (data.customFacts||[]).map(t=>({icon:'pen', t}));
  const wrap = document.getElementById('facts');
  document.getElementById('more-事実').textContent = `${FACTS.concat(custom).length}件`;
  wrap.innerHTML = FACTS.concat(custom).map(f=>
    `<div class="fact"><div class="icon">${ic(f.icon,20)}</div><div class="t">${f.t}</div><div class="stamp">これは事実</div></div>`
  ).join('');
}
// 「日々の記録から増えていくといいな」→ 記録が実績として自動で事実化（ヨシ君FB 2026-08-17）
function renderAutoFacts(){
  const wrap = document.getElementById('facts-auto');
  const auto = [];
  const n = data.waves.length;
  const days = Object.keys(data.days).length;
  const streak = calcStreak();
  if(n>0) auto.push({icon:'wave', t:`消えたい波を ${n}回 乗り越えた（全部引いた）`});
  if(days>0) auto.push({icon:'mirror', t:`できたことを ${days}日分 記録してきた`});
  if(streak>=3) auto.push({icon:'fire', t:`${streak}日連続でチェックインしている`});
  const workDays = Object.values(data.days).filter(a=>a.includes('work')).length;
  if(workDays>=2) auto.push({icon:'work', t:`記録の中で ${workDays}日、仕事をやりきっている`});
  wrap.innerHTML = auto.map(f=>
    `<div class="fact auto"><div class="icon">${ic(f.icon,20)}</div><div class="t">${f.t}</div><div class="stamp">記録から自動</div></div>`
  ).join('');
}
function addFact(){
  const inp = document.getElementById('fact-in');
  const t = inp.value.trim(); if(!t) return;
  data.customFacts = data.customFacts||[];
  data.customFacts.push(t); store.save(data);
  inp.value=''; renderFacts();
}

// ---- log ----
function renderLog(){
  const n = data.waves.length;
  document.getElementById('more-波ロ').textContent = n>0 ? `${n}回` : '';
  document.getElementById('st-count').textContent = n;
  document.getElementById('st-streak').textContent = calcStreak();
  document.getElementById('st-pct').textContent = n>0 ? '100%' : '—';
  document.getElementById('st-note').textContent = n>0 ? 'これまで全部引いている。' : '';
  // simple bar chart of wave durations (last 14)
  const waves = data.waves.slice(-14);
  const max = Math.max(60, ...waves.map(w=>w.sec));
  const bars = waves.map(w=>{
    const h = Math.max(8, Math.round(w.sec/max*80));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:70%;max-width:24px;height:${h}px;background:var(--bar);border-radius:3px 3px 0 0"></div>
      <div style="font-size:9px;color:var(--sub)">${w.sec}s</div></div>`;
  }).join('');
  document.getElementById('chart').innerHTML = n===0
    ? '<div style="font-size:13px;color:var(--sub);text-align:center;padding:20px 0">まだ記録はありません。</div>'
    : `<div style="display:flex;align-items:flex-end;height:110px;gap:2px">${bars}</div>
       <div style="font-size:11px;color:var(--sub);text-align:center;margin-top:8px">波が引くまでの秒数（最近${waves.length}回）</div>`;
}

// ---- feedback ----
const FB_KEY='nagi-fb-app';
const FB_SECS=[
  {id:'全体の第一印象', hint:'開いた瞬間どう感じたか'},
  {id:'波ボタン', hint:'しんどい瞬間に押せそうか'},
  {id:'できてるよミラー', hint:'この言われ方は響くか'},
  {id:'事実の鏡', hint:'事実を見せられてどう感じたか'},
  {id:'波ログ', hint:'「全部引いた」の見せ方はどうか'},
  {id:'足りないもの・欲しいもの', hint:'「本当はこうだったら」を自由に'},
];
const fbDraft=(()=>{try{return JSON.parse(localStorage.getItem(FB_KEY))||{}}catch(e){return{}}})();
function fbSave(){localStorage.setItem(FB_KEY,JSON.stringify(fbDraft))}
function renderFb(){
  const wrap=document.getElementById('fb-list');
  wrap.innerHTML='';
  FB_SECS.forEach(s=>{
    const d=document.createElement('div');
    d.style.cssText='background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px';
    d.innerHTML=`<label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--accd);margin-bottom:8px">${ic('note',15)}${s.id}</label>
      <textarea data-sec="${s.id}" placeholder="${s.hint}" style="width:100%;min-height:64px;border:1px solid #dfe6ec;border-radius:12px;padding:10px;font-family:inherit;font-size:14px;line-height:1.8;background:#fff;resize:vertical;color:var(--ink)"></textarea>`;
    const ta=d.querySelector('textarea');
    ta.value=fbDraft[s.id]||'';
    ta.addEventListener('input',()=>{fbDraft[s.id]=ta.value;fbSave()});
    wrap.appendChild(d);
  });
  document.getElementById('fb-name').value=fbDraft._name||'';
  document.getElementById('fb-name').addEventListener('input',e=>{fbDraft._name=e.target.value;fbSave()});
}
function fbBuild(){
  const name=(fbDraft._name||'').trim()||'（無記名）';
  const date=new Date().toLocaleDateString('ja-JP');
  let body='';
  FB_SECS.forEach(s=>{ const v=(fbDraft[s.id]||'').trim(); if(v) body+=`■ ${s.id}\n${v}\n\n`; });
  if(!body) body='（コメントなし）\n\n';
  return `以下は、うつ当事者向けアプリ試作「ナギ」を実際に触った当事者本人からのフィードバックです。\nコメントは原文のまま尊重して、①刺さった点 ②「違う感」の正体の仮説 ③次に直すべき最重要の1点 の順で分析し、改善版の仕様を提案してください。\n\n【ナギ フィードバック / アプリ】${date}\n書いた人: ${name}\n\n${body}--- 以上 ---`;
}
function fbOpen(){
  document.getElementById('fb-out').value=fbBuild();
  document.getElementById('fb-result').style.display='block';
}
async function fbCopy(btn){
  const t=fbBuild();
  try{await navigator.clipboard.writeText(t)}catch(e){
    const ta=document.getElementById('fb-out'); ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly','');
  }
  const lab=btn.querySelector('span');
  lab.textContent='コピーした'; setTimeout(()=>lab.textContent='コピー',1600);
}
async function fbShare(){
  const t=fbBuild();
  if(navigator.share){ try{await navigator.share({text:t})}catch(e){} }
  else{ fbCopy(document.getElementById('fb-copy')); alert('この端末は共有メニュー非対応のため、コピーしました。LINE等に貼ってください。'); }
}

// ---- init ----
renderToday(); renderChips(); renderFacts(); renderAutoFacts(); renderMirrorHistory(); renderFb();

// ---- self-check (run ?test=1) ----
